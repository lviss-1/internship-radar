sources:
  simplify:
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    max_invalid_ratio: 0.05

delivery:
  max_post_age_hours: 72
  max_posts_per_run: 25
  heartbeat_hour: 8

thresholds:
  post: 60
  ping: 80

quiet_hours:
  timezone: America/New_York
  start: "01:00"
  end: "07:00"

models:
  cheap: claude-haiku-5-5
  strong: claude-sonnet-5-5

scoring:
  max_description_chars: 15000
  score_effort: medium
  score_max_tokens: 8000
  draft_effort: medium
  draft_max_tokens: 16000
  request_timeout_seconds: 120
  worst_case_input_tokens: 20000

# USD per million tokens (Anthropic price table as of 2026-10-06). Cache rates
# assume the standard multipliers: reads 0.1x input, 5-minute writes 1.25x.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50

budget:
  daily_api_call_cap: 200
  monthly_usd_hard_cap: 15
  monthly_usd_target: 10

watchlist_path: config/watchlist.yaml

excluded_companies:
  - Palantir
  - Anthropic

filters:
  seasons:
    - Spring 2027
    - Summer 2027
    - Fall 2027
  unconfirmed_season_terms:
    - N/A
  curated_intern_sources:
    - simplify
  intern_title_keywords:
    - intern
    - interns
    - internship
    - co-op
    - coop
    - apprentice
    - apprenticeship
    - student
  non_intern_title_keywords:
    - new grad
    - senior
    - staff
    - principal
  excluded_categories:
    - quant
    - quantitative finance
    - hardware
    - hardware engineering
  excluded_title_keywords:
    - quant
    - quantitative trading
    - quantitative trader
    - quantitative research
    - quantitative researcher
    - quantitative developer
    - quantitative development
    - quantitative analyst
    - quantitative analytics
    - quantitative strategies
    - trader
    - hardware engineer
    - hardware engineering
    - hardware design
    - electrical engineer
    - electrical engineering
    - fpga
    - asic
    - silicon
    - pcb

