name: eval-scoring

# Manual only. Compares scoring variants on a live sample and logs numbers only.
# Costs a little API spend (capped by budget_usd) that the radar's ledger doesn't count.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Postings with descriptions to score under each variant (5-100)
        type: number
        default: 30
      chars:
        description: Candidate description length cap in characters (1000-50000)
        type: number
        default: 8000
      budget_usd:
        description: Spend cap for the whole eval in USD (0.05-5)
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: eval-scoring
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked --no-dev

      - name: Compare scoring variants
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_SWE_TEXT: ${{ secrets.RESUME_SWE_TEXT }}
          RESUME_PM_TEXT: ${{ secrets.RESUME_PM_TEXT }}
          SAMPLE: ${{ inputs.sample }}
          CHARS: ${{ inputs.chars }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          uv run --no-sync python scripts/eval_scoring.py \
            --sample "$SAMPLE" --chars "$CHARS" --budget-usd "$BUDGET_USD"
