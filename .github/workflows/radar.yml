name: radar

on:
  # Off the top of the hour (GitHub's busiest time) and a few minutes after
  # Simplify's own :01/:31 feed commits. GitHub may delay or drop scheduled
  # runs, so an external cron also calls workflow_dispatch at :20/:50; overlap
  # is safe because runs queue in the concurrency group and state dedupes.
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      heartbeat:
        description: Force a heartbeat (one is also sent on the first run after 08:00 ET)
        type: boolean
        default: false
      check_feedback:
        description: Only check that the Discord bot can read reactions (logs counts, posts nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: .state

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked --no-dev

      - name: Run radar
        id: radar
        env:
          DISCORD_WEBHOOK_MATCHES: ${{ secrets.DISCORD_WEBHOOK_MATCHES }}
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          DISCORD_PING_USER_ID: ${{ secrets.DISCORD_PING_USER_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_SWE_TEXT: ${{ secrets.RESUME_SWE_TEXT }}
          RESUME_PM_TEXT: ${{ secrets.RESUME_PM_TEXT }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          HEARTBEAT: ${{ inputs.heartbeat == true }}
          CHECK_FEEDBACK: ${{ inputs.check_feedback == true }}
        run: |
          args=(--state-dir .state --push-state)
          if [ "$HEARTBEAT" = "true" ]; then args+=(--heartbeat); fi
          if [ "$CHECK_FEEDBACK" = "true" ]; then args+=(--check-feedback); fi
          uv run --no-sync radar "${args[@]}"

      # The radar step reports its own failures; this covers steps before it.
      - name: Report setup failure
        if: failure() && steps.radar.outcome != 'failure'
        env:
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg url "$RUN_URL" \
            '{username: "Internship Radar", allowed_mentions: {parse: []},
              content: ("Internship Radar error: workflow failed before the radar ran. " + $url)}')
          curl -fsS -o /dev/null -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_ERRORS"
